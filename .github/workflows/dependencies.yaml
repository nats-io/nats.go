name: License Check

on:
  push:
    paths:
      - 'go.mod'
      - 'go_test.mod'
      - 'dependencies.tpl'
      - '.github/workflows/dependencies.yaml'
    branches:
      - main

jobs:
  license-check:
    runs-on: ubuntu-latest

    env:
      BRANCH_NAME: update-dependencies-report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      # encoders/protobuf needs protobuf, which only go_test.mod requires (go-licenses can't take -modfile)
      - name: Run license check
        run: |
          cp go_test.mod go.mod
          cp go_test.sum go.sum
          go-licenses report ./... --ignore github.com/nats-io/nats.go --template dependencies.tpl > dependencies.md
          git checkout -- go.mod go.sum

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check for changes
        id: git_diff
        run: |
          git fetch
          git diff --exit-code dependencies.md || echo "has_changes=true" >> $GITHUB_ENV

      - name: Commit changes
        if: env.has_changes == 'true'
        run: |
          git checkout -B "$BRANCH_NAME"
          git add dependencies.md
          git commit -m "Update dependencies.md"
          git push --force origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: env.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[]')" ]; then
            exit 0
          fi
          gh pr create --title "Update dependencies.md" --body "This PR updates the dependencies report" --head "$BRANCH_NAME" --base main

