name: Test nats-server@main
on:
  schedule:
    - cron: "30 8 * * *"

jobs:
    test:
        runs-on: ubuntu-latest-8-cores
        # Run inside an alpine container on the same docker network as the
        # tester service, matching ci.yaml. The nightly-latest-nats-main image
        # is built daily by the upstream synadia/ntf-server repo against the
        # current nats-server main branch.
        container: golang:1.26-alpine
        services:
          nats:
            image: synadia/ntf-server:nightly-latest-nats-main
            # The ntf-server entrypoint is the tester binary; `serve` starts the
            # management API. `--advertise nats` makes gossiped cluster addresses
            # (and generated TLS cert SANs) resolve as `nats` from inside the job.
            command: serve --advertise nats
            options: --name nats
        env:
          TESTER_NATS_URL: nats://nats:4222
          CGO_ENABLED: "1"
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install build deps
              run: |
                apk add --no-cache gcc libc-dev git make bash curl ca-certificates

            # The nightly-latest-nats-main tag is mutable; if upstream stopped
            # pushing it, this job would silently keep testing a stale server.
            # The INFO line from the tester's management endpoint carries the
            # bundled nats-server version, making staleness visible in the logs.
            - name: Log server version
              shell: bash --noprofile --norc -eo pipefail {0}
              run: |
                timeout 5 bash -c 'head -c 512 < /dev/tcp/nats/4222' || true
                echo

            - name: NoRace tests
              shell: bash --noprofile --norc -x -eo pipefail {0}
              run: |
                go test -modfile=go_test.mod -v -run=TestNoRace -p=1 ./... --failfast -vet=off

            - name: Test
              shell: bash --noprofile --norc -x -eo pipefail {0}
              run: |
                go test -modfile=go_test.mod -race -v -p=1 ./... --failfast -vet=off -tags=internal_testing
